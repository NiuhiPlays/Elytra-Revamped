plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

// Determine Minecraft version from command line (-PmcVersion) or default to 1.21.4
def mcVersion = project.hasProperty('mcVersion') ? project.mcVersion : project.minecraft_version
def fabricVersion = mcVersion == '1.21.5' ? project.fabric_version_1_21_5 : project.fabric_version_1_21_4
def yaclVersion = mcVersion == '1.21.5' ? project.yacl_version_1_21_5 : project.yacl_version_1_21_4
def modmenuVersion = mcVersion == '1.21.5' ? project.modmenu_version_1_21_5 : project.modmenu_version_1_21_4
def yarnMappings = mcVersion == '1.21.5' ? '1.21.5+build.1' : project.yarn_mappings

version = "${project.mod_version}+${mcVersion}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.isxander.dev/releases' } // YACL
	maven { url = 'https://maven.terraformersmc.com/' }   // ModMenu
	maven { url = 'https://maven.wispforest.io/releases' } // Accessories
	maven { url = 'https://maven.su5ed.dev/releases' }     // Accessories (secondary)
	maven { url = 'https://maven.fabricmc.net' }           // Fabric
	maven { url = 'https://maven.shedaniel.me/' }          // Shedaniel's mods
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"elytra-mod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${mcVersion}"
	mappings "net.fabricmc:yarn:${yarnMappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricVersion}"
	modCompileOnly "io.wispforest:accessories-fabric:${project.accessories_version}"
	modImplementation "dev.isxander:yet-another-config-lib:${yaclVersion}"
	modImplementation "com.terraformersmc:modmenu:${modmenuVersion}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mcVersion", mcVersion

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "mcVersion": mcVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	archiveFileName = "${archives_base_name}-${version}.jar"

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Add publishing repos if needed
	}
}